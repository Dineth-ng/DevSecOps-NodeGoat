      - name: Scan repository history for secrets
        run: |
          test -f .gitleaksignore

          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -w /repo \
            zricethezav/gitleaks:latest \
            git /repo \
            --gitleaks-ignore-path /repo/.gitleaksignore \
            --redact \
            --exit-code 1 \
            --report-format json \
            --report-path /repo/reports/gitleaks.json